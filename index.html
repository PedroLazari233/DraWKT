<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DraWKT</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    
    <section class="canvas-panel">
      <canvas id="canvas"></canvas>
    </section>

    <section class="wkt-panel">
      <div class="toolbar">
        <section>
          <h3>
            Draw mode
          </h3>
          <button id="standartModeBtn">Standart</button>
          <button id="circleModeBtn">Circle</button>
          <button id="pathModeBtn">Path</button>
        </section>
        <section>
          <h3>
            Snap mode
          </h3>
          <button id="snapToGridModeBtn">Grid</button>
          <button id="snapToVertexModeBtn">Vertex</button>
        </section>
      </div>
      
      <div class="output">
        <h2>WKT</h2>
        <textarea id="wktOutput" readonly></textarea>
        <button id="clearBtn">Clear</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
